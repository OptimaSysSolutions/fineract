name: Fineract Provider Build and Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  determine_version:
    runs-on: self-hosted
    outputs:
      chart_version: ${{ steps.extract_version.outputs.chart_version }}
      environment: ${{ steps.determine_environment.outputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: extract_version
        name: "Extract Version"
        run: |
          CURRENT_VERSION=$(grep '^fineract-provider=' .github/variables/version.properties | cut -d '=' -f 2)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Error: No version found for fineract-provider in version.properties"
            CURRENT_VERSION="0.0.1"
          fi
          echo "chart_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Chart version: $CURRENT_VERSION"

      - id: determine_environment
        name: Determine Environment
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=dev" >> "$GITHUB_ENV"
            echo "env=dev" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "env=prod" >> "$GITHUB_ENV"
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_ENV"
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "Environment Determined is ${{ env.env }}"

  variables_check:
    runs-on: self-hosted
    needs: determine_version
    environment: ${{ needs.determine_version.outputs.environment }}
    steps:
      - name: Print Chart Versions
        run: |
          echo "Chart version from the outputs : ${{ needs.determine_version.outputs.chart_version }}"
          echo "chart_version=${{ needs.determine_version.outputs.chart_version }}" >> $GITHUB_ENV
          echo "Chart version from the env : ${{ env.chart_version }}"

  build:
    runs-on: self-hosted
    needs: determine_version
    environment: ${{ needs.determine_version.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Gradle Project
        run: ./gradlew clean bootJar

      - name: Verify build artifacts
        working-directory: fineract-provider
        run: |
          ls -l
          cd build/libs
          echo "Build artifacts in build/libs:"
          ls -l

      - name: Log in to Harbor Registry
        run: |
          echo '${{ secrets.HARBOR_PASSWORD }}' | docker login ${{ vars.HARBOR_REGISTRY }} -u '${{ secrets.HARBOR_USERNAME }}' --password-stdin

      - name: Build and Push Docker Image using Jib
        working-directory: fineract-provider
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          IMAGE_VERSION: ${{ needs.determine_version.outputs.chart_version }}
        run: |
          ../gradlew jib

  helm:
    runs-on: self-hosted
    needs: determine_version
    environment: ${{ needs.determine_version.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Package Helm Chart
        working-directory: helm
        run: |
          echo "Creating env folder for fineract-provider"
          mkdir -p fineract-provider/env
          
          echo "Creating charts folder for fineract-provider"
          mkdir -p fineract-provider/charts
          
          echo "Copying env files to the chart folder"
          cp -r env/* fineract-provider/env/ || true
          
          echo "Packaging Helm chart"
          helm package fineract-provider \
            --version ${{ needs.determine_version.outputs.chart_version }} \
            --app-version ${{ needs.determine_version.outputs.chart_version }}
          
          echo "Packaged files:"
          ls -l

      - name: Upload Helm Chart to S3
        working-directory: helm
        run: |
          aws s3 cp fineract-provider-${{ needs.determine_version.outputs.chart_version }}.tgz \
            s3://${{ vars.S3_BUCKET }}/charts/fineract-provider/fineract-provider-${{ needs.determine_version.outputs.chart_version }}.tgz

  deploy:
    runs-on: self-hosted
    needs:
      - build
      - helm
      - determine_version
    environment: ${{ needs.determine_version.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USERNAME }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          envs: |
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }},
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }},
            AWS_REGION=af-south-1
          script: |
            # Install dependencies
            sudo apt-get update -y
            
            if ! command -v unzip &> /dev/null; then
              echo "Installing unzip..."
              sudo apt-get install -y unzip
            fi
            
            if ! command -v aws &> /dev/null; then
              echo "Installing AWS CLI..."
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip awscliv2.zip
              sudo ./aws/install
              rm -rf awscliv2.zip aws/
            fi
            
            # Create Harbor credentials secret
            echo "Creating Harbor credentials secret..."
            if ! kubectl get secret harbor-credentials -n ${{ vars.K8S_NAMESPACE }}; then
                echo "Creating new Harbor credentials secret..."
            else
                echo "Updating existing Harbor credentials secret..."
                kubectl delete secret harbor-credentials -n ${{ vars.K8S_NAMESPACE }}
            fi
            kubectl create secret docker-registry harbor-credentials \
              --docker-server=${{ vars.HARBOR_REGISTRY }} \
              --docker-username='${{ secrets.HARBOR_USERNAME }}' \
              --docker-password='${{ secrets.HARBOR_PASSWORD }}' \
              -n ${{ vars.K8S_NAMESPACE }}
            
            # Download and deploy Helm chart
            echo "Downloading Helm chart from S3..."
            aws s3 cp s3://${{ vars.S3_BUCKET }}/charts/fineract-provider/fineract-provider-${{ needs.determine_version.outputs.chart_version }}.tgz ./
            
            echo "Extracting Helm chart..."
            tar -xzvf fineract-provider-${{ needs.determine_version.outputs.chart_version }}.tgz
            
            echo "Deploying Helm chart..."
            helm upgrade --install fineract-provider \
              ./fineract-provider-${{ needs.determine_version.outputs.chart_version }}.tgz \
              --namespace ${{ vars.K8S_NAMESPACE }} \
              --create-namespace \
              -f fineract-provider/values.yml \
              -f fineract-provider/env/${{ needs.determine_version.outputs.environment }}.yml \
              -f fineract-provider/environments/values-${{ needs.determine_version.outputs.environment }}.yml \
              --force \
              --set image.repository=${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/fineract-provider,image.tag=${{ needs.determine_version.outputs.chart_version }}
            
            echo "Deployment completed successfully!"

  write_version:
    runs-on: self-hosted
    needs:
      - deploy
      - variables_check
      - determine_version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update version in properties file
        run: |
          # Get current version
          CURRENT_VERSION="${{ needs.determine_version.outputs.chart_version }}"
          
          # Parse version components
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "Updating version from $CURRENT_VERSION to $NEW_VERSION"
          
          # Update the properties file
          sed -i "s/^fineract-provider=.*/fineract-provider=$NEW_VERSION/" .github/variables/version.properties
          
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Commit and push changes
          git add .github/variables/version.properties
          git commit -m "Update fineract-provider version to $NEW_VERSION [skip ci]"
          git push
